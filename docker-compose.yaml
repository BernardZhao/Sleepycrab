version: '3.8'
services:
  plex:
    container_name: plex
    image: plexinc/pms-docker
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./configs/plex/config:/config
      - ${DATA_ROOT:-/data}/media:/data
      - /dev/shm:/transcode
    network_mode: host
    environment:
      - TZ=America/Los_Angeles
      - ADVERTISE_IP=http://${HOST_IP:-10.0.0.11}:32400
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - ./configs/sonarr/config:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - ./configs/radarr/config:/config
      - ${DATA_ROOT:-/data}:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    volumes:
      - ./configs/prowlarr/config:/config
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    restart: unless-stopped


  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
      - 9696:9696
      - 8191:8191
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - SERVER_CITIES=Los Angeles
      - WIREGUARD_ADDRESSES=10.2.0.2/32
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /pf-sync.sh {{PORT}}
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-10.0.0.0/24}
      - TZ=America/Los_Angeles
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=0"
    restart: unless-stopped
    volumes:
      - ./scripts/pf-sync.sh:/pf-sync.sh:ro
    labels:
      - "wud.trigger.docker.autoupdate.enabled=false"
    networks:
      default:
        aliases:
          - transmission-openvpn
          - transmission
          - prowlarr
          - flaresolverr

  transmission:
    image: lscr.io/linuxserver/transmission
    container_name: transmission
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - ${DATA_ROOT:-/data}/downloads:/data
      - ${DATA_ROOT:-/data}/downloads/transmission-home:/config
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Los_Angeles
    ports:
      - 5055:5055
    volumes:
      - ./configs/overseerr/config:/app/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sleepycrab_default"
      - "traefik.http.routers.overseerr-rtr.entrypoints=web"
      - "traefik.http.routers.overseerr-rtr.rule=Host(`media.nymori.com`) || Host(`${HOST_IP:-10.0.0.11}`)"
      - "traefik.http.routers.overseerr-rtr-secure.entrypoints=websecure"
      - "traefik.http.routers.overseerr-rtr-secure.rule=Host(`media.nymori.com`) || Host(`${HOST_IP:-10.0.0.11}`)"
      - "traefik.http.routers.overseerr-rtr-secure.tls=true"
      - "traefik.http.routers.overseerr-rtr.service=overseerr-svc"
      - "traefik.http.routers.overseerr-rtr-secure.service=overseerr-svc"
      - "traefik.http.services.overseerr-svc.loadbalancer.server.port=5055"

  wud:
    image: getwud/wud
    container_name: wud
    environment:
      - TZ=America/Los_Angeles
      - WUD_AUTH_ADMIN_USER=admin
      - WUD_AUTH_ADMIN_PASSWORD=${WUD_ADMIN_PASSWORD}
      - WUD_WATCHER_LOCAL_WATCHDIGEST=true
      - WUD_TRIGGER_DOCKER_AUTOUPDATE_AUTO=true
      - WUD_TRIGGER_DOCKER_AUTOUPDATE_THRESHOLD=minor
      - WUD_TRIGGER_DOCKER_AUTOUPDATE_PRUNE=true
      - WUD_TRIGGER_NTFY_ALERT_AUTO=true
      - WUD_TRIGGER_NTFY_ALERT_THRESHOLD=major-only
      - WUD_TRIGGER_NTFY_ALERT_URL=http://ntfy
      - WUD_TRIGGER_NTFY_ALERT_TOPIC=homeserver
      - WUD_TRIGGER_NTFY_ALERT_AUTH_TOKEN=${WUD_NTFY_TOKEN}
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/wud:/store
    restart: unless-stopped

  traefik:
    image: 'traefik:v3'
    container_name: 'traefik'
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sleepycrab_default"
      - "--ping=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Los_Angeles
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    restart: unless-stopped


  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=America/Los_Angeles
      - NTFY_BASE_URL=https://ntfy.nymori.com
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      - NTFY_AUTH_FILE=/etc/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_LOGIN=true
      - NTFY_BEHIND_PROXY=true
    volumes:
      - ./configs/ntfy/cache:/var/cache/ntfy
      - ./configs/ntfy/config:/etc/ntfy
    ports:
      - 8081:80
    healthcheck:
      test: "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q healthy || exit 1"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    init: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sleepycrab_default"
      - "traefik.http.routers.ntfy-rtr.entrypoints=web"
      - "traefik.http.routers.ntfy-rtr.rule=Host(`ntfy.nymori.com`)"
      - "traefik.http.routers.ntfy-rtr-secure.entrypoints=websecure"
      - "traefik.http.routers.ntfy-rtr-secure.rule=Host(`ntfy.nymori.com`)"
      - "traefik.http.routers.ntfy-rtr-secure.tls=true"
      - "traefik.http.routers.ntfy-rtr.service=ntfy-svc"
      - "traefik.http.routers.ntfy-rtr-secure.service=ntfy-svc"
      - "traefik.http.services.ntfy-svc.loadbalancer.server.port=80"

networks:
  default:
    name: sleepycrab_default
